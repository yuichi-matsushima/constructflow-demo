name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
      # DBページは force-dynamic のためビルド時にDB接続不要(DATABASE_URL未設定でも通る)
      - run: npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=4096
